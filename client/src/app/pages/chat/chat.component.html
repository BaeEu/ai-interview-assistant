<div class="chat-container" [ngClass]="{dark: themeService.darkMode}">

    <!-- Category -->
    <div class="category-section">

        <select [(ngModel)]="selectedCategory">

            <option *ngFor="let category of categories" [value]="category.name">
                {{ category.name }}
            </option>

        </select>

    </div>

    <!-- Chat Messages -->
    <div class="chat-box" #chatBox>

        <div *ngIf="messages.length === 0" class="empty-state">

            <h2>Welcome 👋</h2>

            <p>Ask your first interview question</p>

        </div>

        <div *ngFor="let message of messages" [ngClass]="message.sender">

            <div class="message-header">

                <strong>
                    {{ message.sender === 'user'
                    ? 'You'
                    : 'AI Assistant' }}
                </strong>

                <span class="message-time">
                    {{ message.time }}
                </span>

            </div>

            <div class="message-content" [innerHTML]="formatMessage(message.text)">
            </div>

            <button *ngIf="message.sender === 'ai'" class="copy-btn" (click)="copyMessage(message.text)">

                Copy

            </button>

        </div>

        <!-- Loading -->
        <div *ngIf="loading" class="loading">

            <div class="spinner"></div>

            <span>AI is typing...</span>

        </div>

    </div>

    <!-- Bottom Input -->
    <div class="input-wrapper">

        <div class="input-area">

            <textarea #messageInput [(ngModel)]="userMessage" placeholder="Ask interview questions..." rows="1"
                (input)="autoResize(messageInput)" (keydown.enter)="handleEnter($event)">
            </textarea>

            <div class="button-group">

                <button class="send-btn" (click)="sendMessage()" [disabled]="loading">

                    {{ loading ? 'Sending...' : 'Send' }}

                </button>

                <button class="clear-btn" (click)="clearChat()">

                    Clear

                </button>

            </div>

        </div>

    </div>

</div>
